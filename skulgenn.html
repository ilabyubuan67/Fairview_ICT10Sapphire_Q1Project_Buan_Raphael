<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raph's Udon Shop SKU Generator</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>



   
    <style>
        body{
            background-color:#d87607;
            text-align: center;
            font-size: 22px;
        }
        nav{
            background-color: #e9ece6;
            padding: 10px;}

        .container{
            width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: #F5EEDC;
            border-radius: 25px;
            box-shadow: 0 10px 30px #3F5F24;
        }
        h1{
            color: #96791b;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .put-Udon{
            text-align: left;
            margin: 15px 0;
        }
        .put-Udon label{
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #b35b29;
            margin-bottom: 5px;
        }
        .put-Udon input{
            width: 100%;    
            padding: 12px 20px;
            background-color: #FFF9EC;
            border: 1px solid #C47A44;
            border-radius: 12px;
;
        }
        .sku-output{
            margin-top: 25px;
            padding: 20px;
            background-color: #FFF9EC;
            border-radius: 15px;
            border: 1px solid #b35b29;
            color: #000000;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Receipt Generator</a>
        <a href="skulgenn.html">SKU Generator</a>
    </nav>

<div class="container">
    <h1>Raphys SKU GENERATOR</h1>
    <h3>Sku Generator!!</h3>


    <div class="put-Udon">
            <label for="category">Product Category:</label>
            <input type="text" id="category" placeholder="ex: Udon">
        </div>

        <div class="put-Udon">
            <label for="pname">Product Name:</label>
            <input type="text" id="pname" placeholder="ex: Kake Udon">
        </div>

        <div class="put-Udon">
            <label for="qty">Stock Quantity:</label>
            <input type="number" id="qty" placeholder="ex: 2">
        </div>

        <button py-click="generate_sku">Generate SKU</button>

        <div class="sku-output">
            <div id="div_id">Here is your SKU below!</div>
        </div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
