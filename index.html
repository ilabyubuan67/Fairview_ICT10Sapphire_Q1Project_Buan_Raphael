<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raphael's Udon Receipt Generator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />


    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body{
            background-color: #4e1a06;
            text-align: center;
            font-size: 24px;
        }
        nav{
            background-color: #8c948c;
            padding: 15px;
            margin-bottom: 20px;
        }
        nav a{
            color: #8c948c;
            margin: 0 15px;
            font-weight: 700;
            font-size: 18px;
        }

        .container{
            width: 920px;
            margin: 40px auto;
            padding: 15px;
            background-color: #8c948c;
            border-radius: 25px;
        }
        .container button{
            padding: 35px;
            margin: 15px;
            background-color: #C47A44;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
        }
        h1{
            color: #696420;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            margin-bottom: 10px;
        }
        h2{
            color: #cfccca;
        }
        .receipt{
            margin-top: 25px;
            padding: 20px;
            background-color: #FFF9EC;
            border-radius: 15px;
            border: 2px solid #5C3B28;
        }
    </style>
</head>
<body>


    <nav>
         <a href="skulgenn.html">SKU Generator</a>
        <a href="index.html">Receipt Generator</a>
    </nav>

    <div class="container">
        <h1>Raphael's Udon Receipt Generator</h1>
        <h3>Choose your Udon!</h3>

    <label class="Udon-choice">
        <input type="checkbox" id="beefudon">
        Beef Udon - ₱240.00
    </label>

    <label class="Udon-choice">
        <input type="checkbox" id="curryudon">
        Curry Udon - ₱290.00
    </label>

    <label class="Udon-choice">
        <input type="checkbox" id="kakeudon">
        Kake Udon - ₱125.00
    </label>

        <button py-click="order">Order</button>

    <div id="receipt"></div>
        <div class="receipt">
            <h3>This is your Receipt!</h3>
            <p> Subtotal: <span id="subtotal">₱0.00</span> </p>
            <p> VAT (12%): <span id="vat">₱0.00</span> </p>
            <p> Total: <span id="total">₱0.00</span> </p>
        </div>
        <div id="div_id"></div> 
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
